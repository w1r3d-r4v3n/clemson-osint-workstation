name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux scripts and workflow tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Validate shell syntax
        run: bash -n install.sh bin/osint-doctor bin/osint-portal

      - name: Validate Python and JSON
        run: |
          python3 -m py_compile bin/osint-case tests/test_case_workflow.py tests/test_portal.py
          python3 -m json.tool firefox-policies.json >/dev/null

      - name: Run tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  windows:
    name: PowerShell syntax
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
