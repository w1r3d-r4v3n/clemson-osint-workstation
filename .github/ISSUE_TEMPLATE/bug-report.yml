name: Bug report
description: Report a reproducible installer, workflow, or documentation problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach case evidence, credentials, personal data, or information about a research subject.
  - type: input
    id: version
    attributes:
      label: Kit version or commit
      placeholder: 1.0.0 or a full commit SHA
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Ubuntu 24.04.5 in VirtualBox 7.2.6 on Windows 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a synthetic example and remove usernames, paths, URLs, and other sensitive information.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Paste only the minimum relevant output after removing secrets and personal or target data.
      render: shell
